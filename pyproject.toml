[project]
name = "computer-vision"
version = "0.1.0"
description = "CDR as an adversarial defense for vision-language models: empirical evaluation and adaptive-attack analysis (ACV course project)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "torch>=2.2",            # cloud: install the CUDA build from the pytorch index
    "transformers>=4.44",
    "accelerate>=0.30",
    "pillow>=10.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
demo = ["gradio>=4.0"]
metrics = ["lpips>=0.1.4"]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools]
packages = ["src"]
