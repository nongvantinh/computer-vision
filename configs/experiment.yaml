# MVP experiment configuration (source of truth: docs/proposal/proposal.tex)
seed: 1234

model:
  model_id: llava-hf/llava-1.5-7b-hf
  device: cuda
  dtype: float16
  gradient_checkpointing: true
  load_in_4bit: true      # NF4 quantization to fit a 16 GB GPU (free-tier T4)

dataset:
  imagenet_val_dir: data/imagenet/val    # ImageFolder layout: val/<wnid>/*.JPEG
  manifest: configs/dataset_200.json
  class_index_cache: configs/imagenet_class_index.json
  n_classes: 20
  per_class: 10
  image_size: 336

# Defense conditions (proposal §3.6). D0 baseline, JPEG curve, real CDR (Dangerzone).
# ICDR is BLOCKED (commercial Aspose dependency; see docs/implementation/icdr.md) and
# left out of the active set. Re-add "icdr" below only with a licensed ICDR_CMD.
# build_defenses skips any defense whose tool is unavailable rather than crashing.
defenses:
  - D0
  - jpeg90
  - jpeg75
  - jpeg50
  - dangerzone

# External tool commands (real tools; see docs/implementation/*.md)
tools:
  # ICDR: set only with a licensed Aspose build. {input}/{output} placeholders required.
  # icdr_cmd: "java -jar external/ICDR/icdr.jar {input} {output}"
  dangerzone_cmd: "dangerzone-cli"

evaluation:
  max_new_tokens: 16
